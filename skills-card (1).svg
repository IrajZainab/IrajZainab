      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;family=Inter:wght@500;600&amp;display=swap');
      .disp{font-family:'Sora',sans-serif;}
      .body{font-family:'Inter',sans-serif;}
