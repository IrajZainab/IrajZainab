<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;family=Inter:wght@400;600&amp;display=swap');
      .disp{font-family:'Sora',sans-serif;}
      .body{font-family:'Inter',sans-serif;}
    </style>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
