    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg3)"/>
  <text x="48" y="46" class="disp" font-size="22" font-weight="700" fill="#e9d5ff">🚀 Featured Projects</text>

