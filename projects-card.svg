      <text x="18" y="52" font-size="12" fill="#a78bfa">Technical, on-page &amp; competitor research</text>
      <text x="18" y="90" font-size="12" fill="#67e8f9">💻 View Repo →</text>
    </g>
    <g transform="translate(792,64)">
