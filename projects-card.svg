      <text x="18" y="30" font-size="15" font-weight="600" fill="#f3e8ff">🎯 Google Ads Campaign</text>
      <text x="18" y="52" font-size="12" fill="#a78bfa">Lead-gen campaign with high conversions</text>
      <text x="18" y="90" font-size="12" fill="#67e8f9">💻 View Repo →</text>
