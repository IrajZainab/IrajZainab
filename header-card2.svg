<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700;800&amp;family=Inter:wght@500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .disp{font-family:'Sora',sans-serif;}
      .body{font-family:'Inter',sans-serif;}
      .mono{font-family:'JetBrains Mono',monospace;}
    </style>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160b28"/>
